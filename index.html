<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="把長文字拆成一句一行，使用閱讀尺協助專注的無障礙閱讀工具。" />
    <meta name="theme-color" content="#f4efe5" />
    <title>逐句｜專注閱讀工具</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#reader">跳到閱讀區</a>

    <header class="site-header">
      <a class="brand" href="#top" aria-label="逐句首頁">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>逐句</span>
      </a>
      <p>讓眼睛一次只需要照顧一句話。</p>
    </header>

    <main id="top">
      <section class="intro" aria-labelledby="page-title">
        <div class="intro-copy">
          <p class="eyebrow">FOCUS READER · 專注閱讀</p>
          <h1 id="page-title">把一大段文字，<br /><em>變成讀得下去的節奏。</em></h1>
          <p class="lede">貼上文字，系統會依句號、問號、驚嘆號與換行自動分句。用鍵盤或滑鼠，讓閱讀尺陪你逐句前進。</p>
        </div>
        <div class="how-to" aria-label="三步驟使用說明">
          <span>01 貼上文字</span>
          <span>02 自動分句</span>
          <span>03 逐句閱讀</span>
        </div>
      </section>

      <section class="workspace" aria-label="專注閱讀工作區">
        <form class="input-panel" id="text-form">
          <div class="panel-heading">
            <div>
              <p class="step-label">STEP 01</p>
              <h2>貼上想閱讀的文字</h2>
            </div>
            <button class="text-button" type="button" id="sample-button">填入範例</button>
          </div>

          <label class="visually-hidden" for="source-text">要閱讀的文字</label>
          <textarea id="source-text" rows="9" placeholder="在這裡貼上文章、講義或任何想慢慢閱讀的文字……" required></textarea>
          <div class="input-footer">
            <span id="character-count" aria-live="polite">0 個字</span>
            <button class="primary-button" type="submit">
              開始逐句閱讀
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
            </button>
          </div>
        </form>

        <section class="reader-panel" id="reader" aria-labelledby="reader-title">
          <div class="reader-toolbar">
            <div>
              <p class="step-label">STEP 02</p>
              <h2 id="reader-title">逐句閱讀</h2>
            </div>
            <div class="progress-wrap" aria-label="閱讀進度">
              <span id="progress-text">1 / 4</span>
              <div class="progress-track"><i id="progress-bar"></i></div>
            </div>
          </div>

          <div class="reading-options" aria-label="閱讀顯示設定">
            <fieldset>
              <legend>閱讀標記</legend>
              <div class="segmented-control">
                <label><input type="radio" name="marker" value="highlight" checked /><span>高亮</span></label>
                <label><input type="radio" name="marker" value="underline" /><span>底線</span></label>
                <label><input type="radio" name="marker" value="bullet" /><span>圓點</span></label>
              </div>
            </fieldset>

            <label class="toggle-control">
              <span><b>模糊其他句</b><small>降低視覺干擾</small></span>
              <input id="blur-toggle" type="checkbox" />
              <i aria-hidden="true"></i>
            </label>

            <label class="size-control" for="font-size">
              <span>字級</span>
              <input id="font-size" type="range" min="20" max="36" value="26" />
              <output id="font-size-output" for="font-size">26</output>
            </label>
          </div>

          <div class="reading-stage marker-highlight" id="reading-stage" tabindex="0" aria-label="閱讀內容。按空白鍵或向下鍵閱讀下一句，按向上鍵返回上一句。">
            <ol id="sentence-list"></ol>
            <p class="empty-state" id="empty-state">貼上文字後，句子會整齊地出現在這裡。</p>
          </div>

          <div class="reader-footer">
            <p class="key-help"><kbd>Space</kbd> 或 <kbd>↓</kbd> 下一句　<kbd>↑</kbd> 上一句　<span>也可以直接點選句子</span></p>
            <div class="reader-actions">
              <button type="button" class="icon-button" id="previous-button" aria-label="上一句">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
              </button>
              <button type="button" class="next-button" id="next-button">下一句 <span aria-hidden="true">↓</span></button>
            </div>
          </div>
          <p class="visually-hidden" id="reader-status" aria-live="polite"></p>
        </section>
      </section>
    </main>

    <footer><p>文字只在你的瀏覽器中處理，不會上傳或儲存。</p><p>為更自在的閱讀而設計。</p></footer>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
